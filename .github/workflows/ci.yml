name: CI

# W0.6 出口条件：后端单测红绿 + 前端 build 通过
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: aquila-server (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aquila-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -B test
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: aquila-server/target/surefire-reports

  frontend:
    name: aquila-web (npm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aquila-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aquila-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  probe:
    name: aquila-probe (javac compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aquila-probe
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile (JDK-only, no deps)
        run: javac -d out src/probe/*.java
