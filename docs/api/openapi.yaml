openapi: 3.1.0
info:
  title: Aquila Stock API
  version: 0.1.0
  description: Same-origin API contract for the greenfield Stock foundation.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Report API process health
      security: []
      responses:
        '200':
          description: The API process is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResult'
  /api/auth/csrf:
    get:
      operationId: getAuthCsrf
      summary: Create an anonymous or session-bound CSRF context
      security: []
      responses:
        '200':
          description: A short-lived CSRF token is returned; the context cookie is HttpOnly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResult'
  /api/auth/bootstrap/context:
    post:
      operationId: startBootstrapContext
      summary: Exchange a one-time local bootstrap token for a restricted context
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapTokenRequest'
      responses:
        '200':
          description: Restricted bootstrap cookie was set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResult'
        '401':
          description: The bootstrap token is invalid, consumed, or expired.
  /api/auth/bootstrap/confirm:
    post:
      operationId: confirmBootstrap
      summary: Confirm the authenticator and activate the administrator
      security:
        - csrfToken: []
          bootstrapCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
      responses:
        '200':
          description: Persistent session cookie and one-time recovery codes were issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: Bootstrap context or authenticator code is invalid.
  /api/auth/login:
    post:
      operationId: login
      summary: Authenticate with password and a single-use TOTP step
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie was set; the session token is not returned in JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: Credentials are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '429':
          description: Ten failures occurred within the rolling five-minute window.
  /api/auth/recovery-login:
    post:
      operationId: recoveryLogin
      summary: Create a restricted recovery context using password and a one-time code
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryLoginRequest'
      responses:
        '200':
          description: Short-lived recovery cookie was set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: Credentials or recovery code are invalid.
        '429':
          description: Ten failures occurred within the rolling five-minute window.
  /api/auth/recovery/rebind/start:
    post:
      operationId: startRecoveryRebind
      summary: Create a new authenticator secret in a recovery-only context
      security:
        - csrfToken: []
          recoveryCookie: []
      responses:
        '200':
          description: The new secret and URI are returned for one-time setup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResult'
        '403':
          description: The session is not a recovery context.
  /api/auth/recovery/rebind/confirm:
    post:
      operationId: confirmRecoveryRebind
      summary: Confirm the new authenticator, revoke old recovery material, and require login
      security:
        - csrfToken: []
          recoveryCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
      responses:
        '200':
          description: New one-time recovery codes were returned and re-login is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResult'
        '401':
          description: Recovery context or authenticator code is invalid.
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session and clear authentication cookies
      security:
        - csrfToken: []
          sessionCookie: []
        - csrfToken: []
          recoveryCookie: []
      responses:
        '200':
          description: Current context was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResult'
  /api/auth/session:
    get:
      operationId: getAuthSession
      summary: Resolve the current session from its HttpOnly cookie
      security:
        - sessionCookie: []
        - recoveryCookie: []
      responses:
        '200':
          description: Current authentication context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: No active session exists.
  /api/me:
    get:
      operationId: getCurrentUser
      summary: Resolve the current administrator from the session cookie
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current administrator identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResult'
        '401':
          description: No active administrator session exists.
  /api/auth/sessions:
    get:
      operationId: listSessions
      summary: List administrator sessions with current and revocation state
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessions belonging to the current administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResult'
        '401':
          description: No active administrator session exists.
  /api/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Revoke one session owned by the current administrator
      security:
        - csrfToken: []
          sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResult'
        '401':
          description: No active administrator session exists.
        '404':
          description: The session does not exist or is already revoked.
  /api/auth/reauth:
    post:
      operationId: reauthenticate
      summary: Establish a short-lived context for a sensitive operation
      security:
        - csrfToken: []
          sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: HttpOnly reauthentication cookie was set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthResult'
        '401':
          description: Password or TOTP code is invalid.
        '429':
          description: Ten failures occurred within the rolling five-minute window.
  /api/auth/totp/setup:
    post:
      operationId: startTotpSetup
      summary: Start authenticator replacement after reauthentication
      security:
        - csrfToken: []
          sessionCookie: []
          reauthCookie: []
      responses:
        '200':
          description: Authenticator setup secret and URI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResult'
        '403':
          description: Recent reauthentication is missing or expired.
  /api/auth/totp/confirm:
    post:
      operationId: confirmTotpSetup
      summary: Confirm a replacement authenticator and rotate recovery codes
      security:
        - csrfToken: []
          sessionCookie: []
          reauthCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
      responses:
        '200':
          description: New one-time recovery codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResult'
        '403':
          description: Recent reauthentication is missing or expired.
  /api/auth/recovery-codes/rotate:
    post:
      operationId: rotateRecoveryCodes
      summary: Revoke the previous recovery batch and issue a new batch
      security:
        - csrfToken: []
          sessionCookie: []
          reauthCookie: []
      responses:
        '200':
          description: New one-time recovery codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResult'
        '403':
          description: Recent reauthentication is missing or expired.
  /api/securities:
    get:
      operationId: searchSecurities
      summary: Search securities by canonical code, alias or name
      security:
        - sessionCookie: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of matching securities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritySearchResult'
  /api/watchlist/groups:
    get:
      operationId: listWatchlistGroups
      summary: List the administrator's watchlist groups
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Watchlist groups in display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistGroupListResult'
    post:
      operationId: createWatchlistGroup
      summary: Create a watchlist group up to the frozen group limit
      security:
        - csrfToken: []
          sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        '200':
          description: The created group with its initial version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistGroupResult'
        '409':
          description: The group name already exists or the group limit was reached.
  /api/watchlist/groups/{groupId}:
    delete:
      operationId: deleteWatchlistGroup
      summary: Delete a group and its items
      security:
        - csrfToken: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: The group was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResult'
  /api/watchlist/groups/{groupId}/items:
    get:
      operationId: listWatchlistItems
      summary: List items of one watchlist group
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Items in display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistItemListResult'
    post:
      operationId: addWatchlistItem
      summary: Add a security to a group, enforcing distinct-security capacity
      security:
        - csrfToken: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
      responses:
        '200':
          description: The added item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistItemResult'
        '400':
          description: 'The security code is not a canonical SH: or SZ: code.'
        '404':
          description: The group or security does not exist.
        '409':
          description: Duplicate item or distinct-security capacity reached.
  /api/watchlist/groups/{groupId}/order:
    put:
      operationId: reorderWatchlistGroup
      summary: Reorder items using an expected group version
      security:
        - csrfToken: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '200':
          description: The group with its incremented version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistGroupResult'
        '409':
          description: The expected version no longer matches.
  /api/watchlist/items/{itemId}:
    delete:
      operationId: removeWatchlistItem
      summary: Remove one watchlist item
      security:
        - csrfToken: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The item was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResult'
  /api/hotlist:
    get:
      operationId: listManualHotlist
      summary: List administrator-entered manual hotlist entries
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Manual entries only; candidate ranking is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotlistListResult'
    post:
      operationId: addManualHotlistItem
      summary: Add a manual hotlist entry
      security:
        - csrfToken: []
          sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotlistRequest'
      responses:
        '200':
          description: The manual entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotlistItemResult'
        '404':
          description: The security does not exist.
        '409':
          description: Duplicate entry or hotlist capacity reached.
  /api/hotlist/{itemId}:
    delete:
      operationId: removeManualHotlistItem
      summary: Remove a manual hotlist entry
      security:
        - csrfToken: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The entry was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResult'
  /api/imports/preview:
    post:
      operationId: previewImport
      summary: Validate import rows and persist a preview batch
      security:
        - csrfToken: []
          sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPreviewRequest'
      responses:
        '200':
          description: Row-level validation outcomes; no watchlist items are written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreviewResult'
        '400':
          description: The row count or file name exceeds the frozen limits.
        '413':
          description: The upload exceeds the frozen 2 MiB limit.
  /api/imports/{batchId}:
    get:
      operationId: getImportBatch
      summary: Read a preview batch and its rows
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: The batch preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreviewResult'
  /api/imports/{batchId}/commit:
    post:
      operationId: commitImportBatch
      summary: Atomically commit valid rows to a watchlist group
      security:
        - csrfToken: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: The commit result; repeated calls with the same key replay this result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCommitResult'
        '409':
          description: The batch is no longer in preview or capacity was reached.
  /api/sources:
    get:
      operationId: listSources
      summary: List licensed sources and their permission status
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Licensed sources in code order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConfigListResult'
  /api/sources/{code}/coverage:
    get:
      operationId: listCoverageFacts
      summary: List per-page coverage facts for a source
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coverage facts in page order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageFactListResult'
  /api/sources/{code}/collect:
    post:
      operationId: collectSource
      summary: Trigger a fixture collection run for a source (G02 gate pending)
      security:
        - csrfToken: []
          sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The collection run and its aggregated coverage verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectSourceResult'
        '403':
          description: The source permission is revoked, expired, or outside its validity window.
components:
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    sessionCookie:
      type: apiKey
      in: cookie
      name: AQUILA_SESSION
    recoveryCookie:
      type: apiKey
      in: cookie
      name: AQUILA_RECOVERY
    bootstrapCookie:
      type: apiKey
      in: cookie
      name: AQUILA_BOOTSTRAP
    reauthCookie:
      type: apiKey
      in: cookie
      name: AQUILA_REAUTH
  schemas:
    HealthResult:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          const: OK
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              const: UP
        traceId:
          type: string
          format: uuid
    AuthEnvelope:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          description: 0 on success; otherwise the HTTP status of the error envelope.
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        traceId:
          type: string
          format: uuid
    ErrorResult:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          description: Matches the HTTP status of the response.
        message:
          type: string
        data:
          type: 'null'
          description: Error envelopes always carry a null data value.
        traceId:
          type: string
          format: uuid
    CsrfResult:
      allOf:
        - $ref: '#/components/schemas/AuthEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Short-lived CSRF token; the response is Cache-Control no-store.
    BooleanResult:
      allOf:
        - $ref: '#/components/schemas/AuthEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties:
                type: boolean
    AuthResult:
      allOf:
        - $ref: '#/components/schemas/AuthEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [authenticated, username, purpose, recoveryCodes]
              properties:
                authenticated:
                  type: boolean
                username:
                  type: string
                purpose:
                  type: string
                  enum: [ADMIN, RECOVERY]
                recoveryCodes:
                  type: array
                  description: One-time recovery codes shown once; response is Cache-Control no-store.
                  items:
                    type: string
    TotpSetupResult:
      allOf:
        - $ref: '#/components/schemas/AuthEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [secret, otpauthUri]
              properties:
                secret:
                  type: string
                  description: One-time authenticator secret; response is Cache-Control no-store.
                otpauthUri:
                  type: string
                  format: uri
                  description: Provisioning URI returned once with the secret.
    RecoveryCodesResult:
      allOf:
        - $ref: '#/components/schemas/AuthEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [codes, shownOnce, requiresLogin]
              properties:
                codes:
                  type: array
                  description: One-time recovery codes shown once; response is Cache-Control no-store.
                  items:
                    type: string
                shownOnce:
                  type: boolean
                  const: true
                requiresLogin:
                  type: boolean
    ReauthResult:
      allOf:
        - $ref: '#/components/schemas/AuthEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [expiresAt]
              properties:
                expiresAt:
                  type: string
                  format: date-time
    MeResult:
      allOf:
        - $ref: '#/components/schemas/AuthEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [username, userId]
              properties:
                username:
                  type: string
                userId:
                  type: string
    SessionListResult:
      allOf:
        - $ref: '#/components/schemas/AuthEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SessionSummary'
    SessionSummary:
      type: object
      required: [sessionId, purpose, current, revoked]
      properties:
        sessionId:
          type: string
        purpose:
          type: string
          enum: [ADMIN, RECOVERY]
        current:
          type: boolean
        revoked:
          type: boolean
    BootstrapTokenRequest:
      type: object
      required: [bootstrapToken]
      properties:
        bootstrapToken:
          type: string
          minLength: 32
          writeOnly: true
    LoginRequest:
      type: object
      required: [username, password, totpCode]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          writeOnly: true
        totpCode:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
    RecoveryLoginRequest:
      type: object
      required: [username, password, recoveryCode]
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
        recoveryCode:
          type: string
          writeOnly: true
    ReauthRequest:
      type: object
      required: [password, totpCode]
      properties:
        password:
          type: string
          writeOnly: true
        totpCode:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          writeOnly: true
    AckResult:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          const: 0
        message:
          type: string
          const: OK
        data:
          type: boolean
          const: true
        traceId:
          type: string
          format: uuid
    SecurityDto:
      type: object
      required: [securityCode, exchange, code, securityName, securityType, status]
      properties:
        securityCode:
          type: string
          description: 'Canonical SH: or SZ: prefixed code; aliases never replace it.'
        exchange:
          type: string
          enum: [SH, SZ]
        code:
          type: string
          pattern: '^[0-9]{6}$'
        securityName:
          type: string
        securityType:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DELISTED]
    SecurityPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecurityDto'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
    SecuritySearchResult:
